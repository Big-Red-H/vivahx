# Software VivaHX follows. Each entry:
#
#   id          short name for URLs and file paths (lowercase letters, digits, dashes)
#   name        how it's shown
#   category    one of: Clients, Servers, Trackers, Bots, Misc
#   github      "owner/repo" to follow its GitHub releases (leave out for custom-only software)
#   description one line
#   homepage    optional link
#   platforms   optional, shown next to the name
#   skip_files  optional, file name patterns not to keep, e.g. ["*.txt"]
#   prereleases optional, true to include prereleases
#   no_posts    optional, true to not write news posts for new releases
#   discord_editors  Discord user IDs of the developers who may edit this project's page on
#               VivaHX (they also need a Client, Server or Tracker Dev role). In Discord: Settings >
#               Advanced > Developer Mode, then right-click the person > Copy User ID.
#   github_editors   GitHub usernames who may edit it. Anyone with push access to the project's
#               own GitHub repo can already, without being listed.
#
# Releases not on GitHub go in releases/custom/<id>/<version>.toml (see releases/README.md).

